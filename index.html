<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Execution Tracer & Flowchart</title>

<!-- Pyodide for Browser Python Engine -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<!-- Mermaid for Flowchart Generation -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #0d1117;
    --bg-panel: #161b22;
    --bg-card: #21262d;
    --border: #30363d;
    --text-main: #c9d1d9;
    --text-muted: #8b949e;
    --blue: #58a6ff;
    --green: #2ea043;
    --red: #f85149;
    --purple: #bc8cff;
    --orange: #ffa657;
    --font-code: 'JetBrains Mono', monospace;
    --font-ui: 'Inter', sans-serif;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-main); color: var(--text-main); font-family: var(--font-ui); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  header { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 18px; color: var(--text-main); font-weight: 600; }
  h1 span { font-size: 12px; color: var(--text-muted); font-family: var(--font-code); margin-left: 12px; }

  .layout { display: flex; flex: 1; height: calc(100vh - 50px); }

  /* Left Panel: Editor */
  .editor-pane { width: 40%; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--bg-main); }
  .pane-header { padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); font-family: var(--font-code); font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
  
  textarea { flex: 1; width: 100%; background: var(--bg-main); color: var(--text-main); font-family: var(--font-code); font-size: 13.5px; line-height: 1.5; padding: 16px; border: none; outline: none; resize: none; white-space: pre; }
  
  .btn-run { background: var(--green); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: var(--font-ui); font-size: 13px; }
  .btn-run:hover { opacity: 0.8; }
  .btn-run:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

  /* Right Panel: Output & Trace */
  .right-pane { width: 60%; display: flex; flex-direction: column; background: var(--bg-main); }
  
  .tabs { display: flex; background: var(--bg-panel); border-bottom: 1px solid var(--border); }
  .tab { padding: 12px 20px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--blue); border-bottom: 2px solid var(--blue); }

  .panel-content { flex: 1; overflow-y: auto; padding: 20px; display: none; }
  .panel-content.active { display: block; }

  /* Console Output */
  .console-box { background: #010409; border: 1px solid var(--border); border-radius: 6px; padding: 16px; font-family: var(--font-code); font-size: 13px; color: var(--text-main); white-space: pre-wrap; min-height: 100px; }

  /* Flowchart container */
  .mermaid-container { background: white; border-radius: 8px; padding: 20px; text-align: center; overflow: auto; min-height: 300px; }

  /* Trace Timeline */
  .trace-step { display: flex; margin-bottom: 20px; position: relative; }
  .step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-panel); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--font-code); font-size: 11px; font-weight: bold; color: var(--text-muted); z-index: 2; flex-shrink: 0; margin-top: 4px;}
  .trace-step::after { content: ''; position: absolute; left: 13px; top: 32px; bottom: -20px; width: 2px; background: var(--border); z-index: 1; }
  .trace-step:last-child::after { display: none; }
  
  .step-box { margin-left: 16px; flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .step-code { background: #1a1f26; padding: 10px 14px; font-family: var(--font-code); font-size: 13px; color: var(--orange); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;}
  .step-meta { color: var(--text-muted); font-size: 11px; }
  .step-locals { padding: 12px 14px; font-family: var(--font-code); font-size: 12.5px; }
  
  .var-line { margin-bottom: 6px; word-break: break-all; }
  .var-line:last-child { margin-bottom: 0; }
  .var-name { color: var(--blue); font-weight: 600; }
  .var-val { color: var(--purple); }

  .empty { text-align: center; color: var(--text-muted); font-size: 14px; margin-top: 40px; }
  .error-text { color: var(--red); }
</style>
</head>
<body>

  <header>
    <h1>Code Decoder & Tracer <span>100% Free / No API / Real-time Execution</span></h1>
    <span style="font-size:12px; color:var(--text-muted);">Powered by Pyodide & Mermaid.js</span>
  </header>

  <div class="layout">
    <!-- EDITOR -->
    <div class="editor-pane">
      <div class="pane-header">
        <span>source_code.py</span>
        <button class="btn-run" id="btn-run">▶ Run Code</button>
      </div>
      <textarea id="code-input" spellcheck="false">class Node:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

class SinglyLinkedList:
    def __init__(self):
        self.head = None

    def insert_head(self, val: int) -> None:
        new_node = Node(val, self.head)
        self.head = new_node

    def insert_tail(self, val: int) -> None:
        new_node = Node(val)
        if not self.head:
            self.head = new_node
            return
        curr = self.head
        while curr.next:
            curr = curr.next
        curr.next = new_node

    def delete_value(self, target: int) -> bool:
        if not self.head:
            return False
        if self.head.val == target:
            self.head = self.head.next
            return True
        
        curr = self.head
        while curr.next and curr.next.val != target:
            curr = curr.next
            
        if curr.next:
            curr.next = curr.next.next
            return True
        return False

    def to_list(self) -> list:
        res, curr = [], self.head
        while curr:
            res.append(curr.val)
            curr = curr.next
        return res

if __name__ == "__main__":
    # Real Inputs are defined right here in the code!
    sll = SinglyLinkedList()
    sll.insert_head(20)
    sll.insert_head(10)
    sll.insert_tail(30)
    print("Initial list:", sll.to_list())
    sll.delete_value(20)
    print("After Deleting 20:", sll.to_list())</textarea>
    </div>

    <!-- OUTPUT / TRACE / FLOWCHART -->
    <div class="right-pane">
      <div class="tabs">
        <div class="tab active" data-target="trace">🔍 Line-by-Line Trace</div>
        <div class="tab" data-target="flowchart">🔀 Dynamic Flowchart</div>
        <div class="tab" data-target="console">🖥️ Console Output</div>
      </div>

      <!-- Trace Panel -->
      <div class="panel-content active" id="trace">
        <div class="empty">Click "Run Code" to trace memory and variables.</div>
      </div>

      <!-- Flowchart Panel -->
      <div class="panel-content" id="flowchart">
        <div class="empty">Click "Run Code" to generate logic flowchart.</div>
      </div>

      <!-- Console Panel -->
      <div class="panel-content" id="console">
        <div class="empty">Console output will appear here.</div>
      </div>
    </div>
  </div>

<script>
  mermaid.initialize({ startOnLoad: false, theme: 'default' });

  // Tab switching logic
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel-content').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.target).classList.add('active');
    });
  });

  let pyodideReady = false;
  let pyodide = null;

  async function loadEngine() {
    document.getElementById('btn-run').innerText = "⏳ Loading Python...";
    document.getElementById('btn-run').disabled = true;
    pyodide = await loadPyodide();
    pyodideReady = true;
    document.getElementById('btn-run').innerText = "▶ Run Code";
    document.getElementById('btn-run').disabled = false;
  }
  loadEngine();

  // Python Script to inject for tracing
  // It records lines, functions, local variables, and captures print() output
  const tracerScript = `
import sys
import json
import io
import traceback

def __serialize_obj(obj, depth=0):
    if depth > 2: return "..."
    if isinstance(obj, (int, float, str, bool, type(None))): return repr(obj)
    if isinstance(obj, list): return "[" + ", ".join(__serialize_obj(i, depth+1) for i in obj) + "]"
    if isinstance(obj, dict): return "{" + ", ".join(f"{repr(k)}:{__serialize_obj(v, depth+1)}" for k,v in obj.items()) + "}"
    if hasattr(obj, '__dict__'):
        attrs = {k: __serialize_obj(v, depth+1) for k, v in obj.__dict__.items() if not k.startswith('_')}
        return f"<{type(obj).__name__} {attrs}>"
    return repr(obj)

def run_and_trace(code_str):
    trace_log = []
    
    # Capture print statements
    captured_out = io.StringIO()
    old_stdout = sys.stdout
    sys.stdout = captured_out
    
    def tracer(frame, event, arg):
        # Only trace the user's code string, ignore internal python files
        if frame.f_code.co_filename == "<string>" and event in ['line', 'call']:
            locs = {k: __serialize_obj(v) for k, v in frame.f_locals.items() if not k.startswith('__') and type(v).__name__ not in ('module', 'function', 'type')}
            trace_log.append({
                "line": frame.f_lineno,
                "func": frame.f_code.co_name,
                "event": event,
                "locals": locs
            })
        return tracer

    error_msg = None
    try:
        sys.settrace(tracer)
        exec(code_str, {})
        sys.settrace(None)
    except Exception as e:
        sys.settrace(None)
        error_msg = traceback.format_exc()

    sys.stdout = old_stdout
    
    return json.dumps({
        "trace": trace_log,
        "stdout": captured_out.getvalue(),
        "error": error_msg
    })
`;

  document.getElementById('btn-run').addEventListener('click', async () => {
    if (!pyodideReady) return;
    
    const userCode = document.getElementById('code-input').value;
    // FIX: Using regex /\r?\n/ to split lines handles both Windows (\r\n) and Mac/Linux (\n) formatting properly.
    const codeLines = userCode.split(/\r?\n/);
    
    document.getElementById('btn-run').innerText = "Running...";
    
    try {
      await pyodide.runPythonAsync(tracerScript);
      pyodide.globals.set("user_code", userCode);
      const jsonRes = await pyodide.runPythonAsync(`run_and_trace(user_code)`);
      const result = JSON.parse(jsonRes);
      
      renderTrace(result.trace, codeLines);
      renderConsole(result.stdout, result.error);
      renderFlowchart(result.trace);
      
    } catch (e) {
      renderConsole("", str(e));
    }
    
    document.getElementById('btn-run').innerText = "▶ Run Code";
  });

  function escapeHTML(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function renderConsole(stdout, error) {
    let html = `<div class="console-box">${escapeHTML(stdout) || 'No print output.'}</div>`;
    if (error) {
      html += `<div class="console-box error-text" style="margin-top:10px;">${escapeHTML(error)}</div>`;
    }
    document.getElementById('console').innerHTML = html;
  }

  function renderTrace(trace, codeLines) {
    if (!trace || trace.length === 0) {
      document.getElementById('trace').innerHTML = `<div class="empty">No execution traced. Ensure you have an execution block (e.g., if __name__ == "__main__":)</div>`;
      return;
    }

    let html = '';
    // Filter out 'call' events for the line-by-line view to avoid clutter
    let stepCount = 1;
    
    trace.forEach(step => {
      if(step.event !== 'line') return;
      
      const sourceLine = codeLines[step.line - 1] ? codeLines[step.line - 1].trim() : '(Line missing)';
      
      let locsHtml = '';
      if(Object.keys(step.locals).length === 0){
        locsHtml = `<div style="color:var(--text-muted); font-style:italic;">No local variables</div>`;
      } else {
        for(const [k, v] of Object.entries(step.locals)){
          locsHtml += `<div class="var-line"><span class="var-name">${escapeHTML(k)}</span> = <span class="var-val">${escapeHTML(v)}</span></div>`;
        }
      }

      html += `
        <div class="trace-step">
          <div class="step-num">${stepCount++}</div>
          <div class="step-box">
            <div class="step-code">
              <span>${escapeHTML(sourceLine)}</span>
              <span class="step-meta">Line ${step.line} | ${escapeHTML(step.func)}()</span>
            </div>
            <div class="step-locals">${locsHtml}</div>
          </div>
        </div>
      `;
    });
    
    document.getElementById('trace').innerHTML = html;
  }

  async function renderFlowchart(trace) {
    if (!trace || trace.length === 0) {
      document.getElementById('flowchart').innerHTML = `<div class="empty">No data for flowchart.</div>`;
      return;
    }

    // Build Mermaid logic based on function calls and major transitions
    let graphDef = "graph TD\n";
    graphDef += "Start([Start Execution]) --> ";
    
    let nodeCount = 0;
    let prevNode = "Start";
    let activeFunc = "";

    trace.forEach(step => {
      // Create a node when a function is called, or track main execution loop
      if (step.event === 'call' && step.func !== '<module>') {
        let nodeId = `Node${nodeCount++}`;
        graphDef += `${nodeId}["Call ${step.func}()"]\n`;
        graphDef += `${nodeId} --> `;
        prevNode = nodeId;
      }
    });

    graphDef += "End([Finish])";

    document.getElementById('flowchart').innerHTML = `<div class="mermaid-container"><div class="mermaid" id="mermaid-graph">${graphDef}</div></div>`;
    
    try {
      // Force mermaid to render the newly injected graph
      await mermaid.run({
        querySelector: '.mermaid'
      });
    } catch(e) {
      console.log("Mermaid syntax error:", e);
    }
  }
</script>
</body>
</html>
